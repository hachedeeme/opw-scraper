[project]
name = "opw-scraper"
version = "0.1.0"
description = "Scraper de OPW"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.17.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.8",
]

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py312"
src = ["src"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # orden de imports
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplificaciones
]
